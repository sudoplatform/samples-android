// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        // Defined in settings.gradle.
        gradle.addMavenCentral(delegate)
        gradle.addGradlePlugins(delegate)
    }
    dependencies {
        classpath "com.android.tools.build:gradle:8.12.0"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:compose-compiler-gradle-plugin:$kotlin_version"
        classpath "org.jmailen.gradle:kotlinter-gradle:5.2.0"
        if (project.file("${rootProject.projectDir}/util/vulnerability-scan.gradle").exists()) {
            classpath "org.owasp:dependency-check-gradle:12.2.2"
        }
        if (project.file("${rootProject.projectDir}/util/sonarqube.gradle").exists()) {
            classpath "org.sonarsource.scanner.gradle:sonarqube-gradle-plugin:6.2.0.5505"
        }
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

if (project.hasProperty("ossIndexUsername")) {
    ext["ossIndexUsername"] = "$ossIndexUsername"
} else {
    ext["ossIndexUsername"] = ""
}

if (project.hasProperty("ossIndexPassword")) {
    ext["ossIndexPassword"] = "$ossIndexPassword"
} else {
    ext["ossIndexPassword"] = ""
}

allprojects {
    repositories {
        google()
        gradle.addMavenCentral(delegate)
        // Internal repositories, only used when credentials are configured.
        def nexusUsername = providers.gradleProperty("nexusUsername").orNull
        def nexusPassword = providers.gradleProperty("nexusPassword").orNull
        if (nexusUsername?.trim()) {
            maven {
                name = "android-releases"
                url = "https://repo.tools.anonyome.com/repository/android-releases/"
                credentials {
                    username = nexusUsername
                    password = nexusPassword
                }
            }
            maven {
                name = "android-snapshots"
                url = "https://repo.tools.anonyome.com/repository/android-snapshots/"
                credentials {
                    username = nexusUsername
                    password = nexusPassword
                }
            }
        }
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
