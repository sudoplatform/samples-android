apply plugin: 'com.android.application'
apply plugin: 'com.google.devtools.ksp'
apply plugin: 'kotlin-parcelize'
apply plugin: 'androidx.navigation.safeargs.kotlin'

android {
    namespace = 'com.sudoplatform.direlayexample'
    compileSdk 37
    defaultConfig {
        applicationId 'com.sudoplatform.direlayexample'
        minSdkVersion 26
        targetSdkVersion 37
        versionCode 1
        versionName "4.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }

    packagingOptions {
        pickFirst("META-INF/atomicfu.kotlin_module")
        pickFirst("META-INF/kotlinx-coroutines-core.kotlin_module")
    }
    buildFeatures {
        viewBinding = true
    }
}

dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")

    // spongycastle:prov publishes junit as a regular (non-test) dependency, so it leaks a
    // test-only junit 4.12 onto the app runtime classpath. That pins hamcrest-core to 1.3 and,
    // via AGP consistent resolution, breaks Espresso's hamcrest on the androidTest classpath.
    // Strip junit out of spongycastle's metadata at the source so it never reaches any config.
    components {
        withModule('com.madgag.spongycastle:prov') {
            allVariants {
                withDependencies {
                    removeAll { it.group == 'junit' && it.name == 'junit' }
                }
            }
        }
    }

    // Sudo Platform
    implementation "com.sudoplatform:sudokeymanager:9.0.0"
    implementation "com.sudoplatform:sudodirelay:5.0.0"
    implementation "com.sudoplatform:sudouser:21.1.0"
    implementation 'com.sudoplatform:sudoprofiles:18.0.0'
    implementation 'com.sudoplatform:sudoentitlements:13.0.0'

    // Peer Connection Storage
    implementation "androidx.room:room-runtime:$room_version"
    ksp "androidx.room:room-compiler:$room_version"

    // Posting to peer
    implementation "com.squareup.okhttp3:okhttp:$okhttp_version"

    def coroutine_version = "1.11.0"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutine_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutine_version"

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    def fragment_version = "1.8.9"
    implementation "androidx.fragment:fragment-ktx:$fragment_version"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"

    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'com.google.android.material:material:1.14.0'

    androidTestImplementation "androidx.test:core:1.7.0"
    androidTestImplementation "androidx.test:core-ktx:1.7.0"
    androidTestImplementation "androidx.test.ext:junit:1.3.0"
    androidTestImplementation "androidx.test.ext:junit-ktx:1.3.0"
    androidTestImplementation "androidx.test:runner:1.7.0"
    androidTestImplementation "androidx.test:rules:1.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.7.0"
    androidTestImplementation "androidx.test.espresso:espresso-contrib:3.7.0"
    androidTestImplementation "com.jakewharton.timber:timber:5.0.1"
}

// Kotlin Lint
apply plugin: 'org.jmailen.kotlinter'

kotlinter {
    reporters = ['checkstyle', 'plain']
}

// Vulnerability scanning
if (project.file("${rootProject.projectDir}/util/vulnerability-scan.gradle").exists()) {
    apply from: "${rootProject.projectDir}/util/vulnerability-scan.gradle"
}

// Sonarqube code analysis
if (project.file("${rootProject.projectDir}/util/sonarqube.gradle").exists()) {
    ext.sonarProjectKey = "sudo-di-relay-example-android"
    ext.sonarProjectName = "sudo-di-relay-example-android"
    ext.sonarExclusions = ["*.png", "*.jks", "*.json", "*.key"]
    apply from: "${rootProject.projectDir}/util/sonarqube.gradle"
}
