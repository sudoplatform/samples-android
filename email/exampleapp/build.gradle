apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'
apply plugin: "org.jetbrains.kotlin.plugin.serialization"
// Push notifications need the app's Firebase configuration. Without it the app builds and runs
// without them.
if (file('google-services.json').exists()) {
    apply plugin: 'com.google.gms.google-services'
}

android {
    compileSdkVersion 35
    namespace = "com.sudoplatform.emailexample"
    defaultConfig {
        applicationId 'com.sudoplatform.emailexample'
        minSdkVersion 26
        targetSdkVersion 35
        versionCode 1
        versionName "19.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            testCoverageEnabled = true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled = true
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }
    packagingOptions {
        pickFirst("META-INF/atomicfu.kotlin_module")
        pickFirst("META-INF/kotlinx-coroutines-core.kotlin_module")
        pickFirst("META-INF/LICENSE.md")
        pickFirst("META-INF/LICENSE-notice.md")
        pickFirst("META-INF/NOTICE.md")
    }
    buildFeatures {
        compose = true
    }
    testOptions {
        animationsDisabled = true
    }
}


dependencies {
    // Core library desugaring
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation 'com.sudoplatform:sudouser:21.2.2'
    implementation 'com.sudoplatform:sudoprofiles:18.0.2'
    implementation 'com.sudoplatform:sudoentitlements:13.0.1'
    implementation 'com.sudoplatform:sudonotification:5.0.1'
    implementation 'com.sudoplatform:sudoemail:25.0.0'
    implementation 'com.sudoplatform:sudokeymanager:10.0.0'

    implementation 'com.google.firebase:firebase-messaging:24.1.2'

    def coroutine_version = '1.10.2'
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$coroutine_version"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$coroutine_version"
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0")

    implementation 'androidx.core:core-ktx:1.16.0'

    def lifecycle_version = "2.9.2"
    implementation "androidx.lifecycle:lifecycle-runtime-compose:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_version"

    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'androidx.activity:activity-compose:1.10.1'
    implementation 'androidx.navigation:navigation-compose:2.9.3'
    implementation platform('androidx.compose:compose-bom:2025.06.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    implementation 'com.sun.mail:jakarta.mail:2.0.2'
    implementation 'com.sun.activation:jakarta.activation:2.0.1'

    def androidxTest = '1.7.0'
    def espresso = "3.7.0"
    androidTestImplementation "androidx.test:core:$androidxTest"
    androidTestImplementation "androidx.test:core-ktx:$androidxTest"
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    androidTestImplementation "androidx.test:runner:$androidxTest"
    androidTestImplementation "androidx.test:rules:$androidxTest"
    androidTestImplementation "androidx.test.espresso:espresso-core:$espresso"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
    androidTestImplementation platform('androidx.compose:compose-bom:2025.06.01')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20250517'
}

// Force patched versions of vulnerable transitive dependencies (OWASP dependency-check findings).
// Direct dependencies cannot clear these because the vulnerable artifacts are pulled in by parent libraries.
configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        def group = details.requested.group
        def name = details.requested.name
        if (group == 'io.netty') {
            details.useVersion '4.1.130.Final'
            details.because 'Netty CVEs (CVE-2023-44487, CVE-2025-24970, CVE-2025-25193, CVE-2025-55163, CVE-2025-58056/58057, CVE-2025-67735, ...)'
        } else if (group == 'com.google.protobuf' && name in ['protobuf-java', 'protobuf-java-util', 'protobuf-kotlin']) {
            details.useVersion '3.25.5'
            details.because 'CVE-2024-7254 fixed in protobuf 3.25.5'
        } else if (group == 'io.opentelemetry' && name in ['opentelemetry-api', 'opentelemetry-context']) {
            details.useVersion '1.49.0'
            details.because 'opentelemetry-api/context 1.41.0 vulnerabilities'
        }
    }
}

// Kotlin Lint
apply plugin: 'org.jmailen.kotlinter'

kotlinter {
    reporters = ['checkstyle', 'plain']
}

// Vulnerability scanning
if (project.file("${rootProject.projectDir}/util/vulnerability-scan.gradle").exists()) {
    apply from: "${rootProject.projectDir}/util/vulnerability-scan.gradle"
}

// Sonarqube code analysis
if (project.file("${rootProject.projectDir}/util/sonarqube.gradle").exists()) {
    ext.sonarProjectKey = "sudo-email-example-android"
    ext.sonarProjectName = "sudo-email-example-android"
    ext.sonarExclusions = ["**/*.png", "**/*.jks", "**/*.json", "**/*.key"]
    apply from: "${rootProject.projectDir}/util/sonarqube.gradle"
}
